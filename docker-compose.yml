services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: grc
      POSTGRES_DB: grc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: dev
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/srv
      # 制度原文卷：api 只读挂载（spec §8.2）
      - docstore:/data/documents:ro
      - staging:/tmp
    ports:
      - "${API_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      target: dev
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/srv
      # worker 可写
      - docstore:/data/documents
      - staging:/tmp
    command: arq app.worker.WorkerSettings

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/srv
      - /srv/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  docstore:
  staging:
