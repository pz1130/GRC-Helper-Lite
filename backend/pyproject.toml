[project]
name = "grc-helper-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.9",
    "email-validator>=2.3.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
    "arq>=0.26",
    "redis>=5.2",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.0",
    "cryptography>=50.0.2",
    "jsonschema>=4.26.0",
    "anthropic>=0.40",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "python-docx>=1.1.2",
    "pdfplumber>=0.11.10",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "fpdf2>=2.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入写在默认参数里是框架约定，不是可变默认值。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "app.iam.deps.require",
]

[tool.setuptools.packages.find]
include = ["app*"]
