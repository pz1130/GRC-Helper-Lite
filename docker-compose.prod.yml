# 生产编排。与 docker-compose.yml 的区别不是"参数不同"，是**形态不同**：
#   · 前端是构建好的静态产物 + nginx，不是 vite 开发服务器
#   · 后端没有 --reload，源码不挂进容器（镜像里是什么就跑什么）
#   · 只有 web 对外暴露端口；db / redis / api 都只在内部网络里
#   · 全部 restart: unless-stopped
#
# 用法见 OPERATIONS.md。迁移要单独跑一次：make prod-migrate
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产环境必须设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-grc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grc}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: prod
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      # 制度原文卷：api 只读（spec §8.2），只有 worker 能写
      - docstore:/data/documents:ro
      - staging:/tmp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: prod
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - docstore:/data/documents
      - staging:/tmp
    command: arq app.worker.WorkerSettings
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - api
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  docstore:
  staging:
