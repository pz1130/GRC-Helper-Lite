server {
    listen 80;
    server_name _;

    # 上传的制度文件可能有几十 MB
    client_max_body_size 64m;

    # ── 静态资源压缩 ────────────────────────────────────────────
    # 单个 JS 产物 556 kB，实测 gzip 后约 155 kB。这个系统装在机构内网里，
    # 带宽不一定宽裕，而压缩的代价只是几毫秒 CPU。
    gzip on;
    # text/html 永远会被压缩，**不要写进 gzip_types**——nginx 会因为重复而告警。
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # **gzip_vary 不能省。** 不加这行，中间缓存（机构里的正向代理、CDN）可能把
    # 压缩过的响应发给一个没声明支持 gzip 的客户端，那边直接拿到乱码。
    gzip_vary on;
    # 小响应压了反而更大（gzip 头就有十几字节），而且白费一次 CPU。
    gzip_min_length 1024;
    # 默认 1 压得很浅。5 在体积和 CPU 之间是常用的平衡点，再往上收益迅速衰减。
    gzip_comp_level 5;
    # /api/ 是反代过来的响应，默认不压。审计答复、准备包这类 JSON 可以很大。
    gzip_proxied any;

    # 安全响应头。这是个给审计人员看的系统，页面被别的站点 iframe 进去
    # 做点击劫持是真实风险，而这几行的代价是零。
    add_header X-Frame-Options            "DENY"                        always;
    add_header X-Content-Type-Options     "nosniff"                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    # 应用自带全部资源，不从任何 CDN 取东西，所以 default-src 'self' 就够。
    #
    # img-src 必须放 blob:——图谱导出 PNG 时把 SVG 序列化成 Blob、用
    # createObjectURL 喂给 <img> 再画进 canvas（见 graph/export.ts）。
    # 第一版漏了它，拿 86 条 e2e 打生产栈才发现：同样 3 条在开发栈（无 CSP）
    # 全过、在生产栈全挂。**CSP 是会悄悄打瘫功能的那类改动，必须实跑验证。**
    #
    # style-src 留 'unsafe-inline'：构建产物里有内联样式块。
    # frame-ancestors 与上面的 X-Frame-Options 同义，留着是为了老浏览器。
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 前后端同源，所以不需要 CORS——api 容器不对外暴露端口。
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 抽取、映射这类任务是后台跑的，但导出准备包是同步的，给足时间
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # 单页应用：刷新子路由不能 404
    }
}
